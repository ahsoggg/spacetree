[package]
name = "spacetree"
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ahsoggg-creator/spacetree"

# Not "spacetree": NTFS is case-insensitive and the GUI is SpaceTree.exe in the same target folder.
[[bin]]
name = "spacetree-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
spacetree-core = { version = "0.3.2", path = "../core" }
